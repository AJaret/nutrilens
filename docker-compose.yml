services:
  db:
    image: postgres:16
    container_name: nutrilens-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nutrilens}
      POSTGRES_USER: ${POSTGRES_USER:-nutrilens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nutrilens}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    container_name: nutrilens-api
    depends_on:
      - db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nutrilens}
      POSTGRES_USER: ${POSTGRES_USER:-nutrilens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nutrilens}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      API_PORT: ${API_PORT:-8000}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-dev}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
